<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mann Y Devani</title>
<meta name="description" content="Mann Y Devani — portfolio and link hub for code, game dev, art, video, and published writing.">
<link rel="icon" type="image/png" href="Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --gold:#f5c518; --w:min(44vw,360px); }
html,body { width:100%;height:100%;overflow:hidden;background:#07080a;font-family:'Rajdhani',sans-serif; }

/* subtle scanlines */
body::after {
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.025) 3px,rgba(0,0,0,0.025) 4px);
  pointer-events:none;z-index:9000;
}

/* ── INTERACTIVE CANVAS BG ── */
#bgCanvas {
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}

/* ── HUD ── */
.hc { position:fixed;width:44px;height:44px;border-color:rgba(245,197,24,.3);border-style:solid;pointer-events:none;z-index:200; }
.htl{top:13px;left:13px;border-width:2px 0 0 2px}
.htr{top:13px;right:13px;border-width:2px 2px 0 0}
.hbl{bottom:13px;left:13px;border-width:0 0 2px 2px}
.hbr{bottom:13px;right:13px;border-width:0 2px 2px 0}

.nameplate {
  position:fixed;top:14px;left:14px;z-index:200;
  background:rgba(0,0,0,.8);
  border:1px solid rgba(245,197,24,.28);
  border-left:3px solid var(--gold);
  padding:5px 14px 5px 10px;
}
.np-lbl { font-size:.46rem;letter-spacing:.3em;color:rgba(245,197,24,.5);text-transform:uppercase; }
.np-name { font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:.1em;color:var(--gold);text-shadow:0 0 12px rgba(245,197,24,.55); }

.wanted {
  position:fixed;top:14px;right:14px;z-index:200;
  display:flex;gap:3px;align-items:center;
  background:rgba(0,0,0,.8);border:1px solid rgba(245,197,24,.18);padding:5px 10px;
}
.star{color:var(--gold);font-size:.76rem;opacity:.18}
.star.lit{opacity:1;text-shadow:0 0 8px var(--gold)}

/* ── HINT — styled like a GTA press-button prompt, bottom center ── */
.hint-wrap {
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:200;pointer-events:none;
  display:flex;align-items:center;gap:8px;
  transition:opacity .5s;
}
.hint-key {
  width:28px;height:28px;border-radius:50%;
  border:2px solid rgba(245,197,24,.5);
  background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:.7rem;color:rgba(245,197,24,.8);
  animation:pulse-key 2s ease-in-out infinite;
}
@keyframes pulse-key {
  0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,.3)}
  50%{box-shadow:0 0 0 6px rgba(245,197,24,0)}
}
.hint-txt { font-family:'Rajdhani',sans-serif;font-size:.65rem;
  letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.9);white-space:nowrap; }
.hint-mobile { display:none; }
@media (max-width:700px) {
  .hint-desktop { display:none; }
  .hint-mobile  { display:inline; }
}

/* ── STAGE ── */
.stage {
  position:fixed;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  z-index:10;padding-bottom:0;
}

/*
  char-unit: sized to the SVG aspect ratio 648/991 ≈ 0.654
  Height drives width.  We want the character to fill most of the vertical space.
*/
.char-unit {
  position:relative;
  height:min(72vh,600px);
  width:calc(min(72vh,600px) * 0.654);
  cursor:pointer;
  flex-shrink:0;
}

/* Hover detection zone — extends UP to cover the bubble arc above head */
.hover-zone {
  position:absolute;
  bottom:0;
  left:50%;transform:translateX(-50%);
  width:200%;
  height:160%;
  z-index:5;
  top:auto;
  cursor:pointer;
}

.char-svg-wrap {
  position:absolute;inset:0;z-index:2;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.95)) drop-shadow(0 0 0 rgba(245,197,24,0));
  transition:filter .5s;
}
.char-unit.hovered .char-svg-wrap {
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.95))
         drop-shadow(0 0 35px rgba(245,197,24,.28))
         drop-shadow(0 0 80px rgba(245,197,24,.08));
}

/* ground glow */
.char-unit::after {
  content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
  width:55%;height:10px;
  background:radial-gradient(ellipse,rgba(245,197,24,.2) 0%,transparent 70%);
  pointer-events:none;z-index:1;
}

/* ── BUBBLES ── */
.bubbles-root {
  position:absolute;
  top:30%;
  left:55%;
  width:0;height:0;
  overflow:visible;
  z-index:30;
  pointer-events:none;
}

.bubble {
  position:absolute;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-decoration:none;
  border:2px solid;
  border-radius:10px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  cursor:pointer;
  pointer-events:none;
  opacity:0;
  transform:translate(var(--tx),var(--ty)) scale(0);
  transition:opacity .38s ease, transform .44s cubic-bezier(.34,1.56,.64,1);
  text-align:center;
  overflow:hidden;
  padding:4px 2px;
  margin-left:calc(var(--bw) / -2);
  margin-top:calc(var(--bh) / -2);
  width:var(--bw);
  height:var(--bh);
  will-change:transform,opacity;
}

.char-unit.hovered .bubble {
  opacity:1;
  pointer-events:all;
  transform:translate(var(--tx),var(--ty)) scale(1);
}

.bubble:hover {
  filter:brightness(1.5);
  z-index:50;
  transform:translate(var(--tx),var(--ty)) scale(1.12) !important;
}
.bubble:active { transform:translate(var(--tx),var(--ty)) scale(.93) !important; }

/* all text inside bubble is white always */
.b-icon  { font-size:1.4rem;line-height:1;pointer-events:none;display:block; }
.b-label { font-family:'Oswald',sans-serif;font-size:.6rem;letter-spacing:.08em;
           text-transform:uppercase;line-height:1.1;pointer-events:none;
           color:#fff !important;display:block;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center; }
.b-sub   { font-size:.44rem;letter-spacing:.04em;opacity:.65;line-height:1;
           pointer-events:none;color:#fff !important;display:block; }

/* dot connector tip above bubble */
.bubble::before {
  content:'';
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;
  background:currentColor;box-shadow:0 0 5px currentColor;
  opacity:.8;pointer-events:none;
}

/* connector SVG — hidden on mobile */
.conn-svg {
  position:absolute;top:0;left:0;
  width:0;height:0;overflow:visible;
  pointer-events:none;z-index:25;
}
.conn-svg line { opacity:0;transition:opacity .38s; }
.char-unit.hovered .conn-svg line { opacity:1; }

/* ── MOBILE: hide arc entirely, show grid overlay ── */
@media (max-width:700px) {
  .bubbles-root { display:none; }
  .conn-svg     { display:none; }
}

/* ── MOBILE GRID OVERLAY ── */
.mob-grid {
  display:none;
  position:fixed;inset:0;z-index:500;
  align-items:center;justify-content:center;
  background:rgba(4,5,10,.92);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;
  transition:opacity .28s;
}
.mob-grid.open { opacity:1;pointer-events:all; }

.mob-inner {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:16px;
  width:min(320px,88vw);
  max-height:80vh;
  overflow-y:auto;
}

.mob-btn {
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:14px 4px 10px;
  border-radius:10px;
  border:1.5px solid;
  text-decoration:none;
  background:rgba(0,0,0,.75);
  transition:transform .15s;
  min-height:74px;
}
.mob-btn:active { transform:scale(.93); }
.mob-btn-icon  { font-size:1.6rem;line-height:1;display:block; }
.mob-btn-label {
  font-family:'Oswald',sans-serif;
  font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;line-height:1;display:block;
  white-space:nowrap;
}

.mob-close {
  position:absolute;top:14px;right:14px;
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(245,197,24,.45);
  background:rgba(0,0,0,.8);
  color:var(--gold);font-size:1.1rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;
}

@media (max-width:700px) {
  .mob-grid { display:flex; }
  .char-unit {
    height:min(65vh,460px);
    width:calc(min(65vh,460px) * 0.654);
  }
  .nameplate { top:8px;left:8px;padding:4px 10px 4px 8px; }
  .np-lbl  { font-size:.4rem; }
  .np-name { font-size:.82rem; }
  .wanted  { top:8px;right:8px;padding:4px 8px; }
  .star    { font-size:.6rem; }
  .hc      { width:28px;height:28px; }
  .htl     { top:6px;left:6px; }
  .htr     { top:6px;right:6px; }
  .hbl     { bottom:6px;left:6px; }
  .hbr     { bottom:6px;right:6px; }
  .hint-wrap { bottom:14px; }
  .hint-key  { width:24px;height:24px;font-size:.6rem; }
  .hint-txt  { font-size:.56rem;letter-spacing:.15em; }
}

/* ── CINEMATIC INTRO ── */
#intro {
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  pointer-events:none;
  transition:opacity .8s ease;
}
#intro.fade { opacity:0; }
#intro.gone { display:none; }
.intro-sub  { font-family:'Rajdhani',sans-serif;font-size:.7rem;letter-spacing:.4em;
              color:rgba(245,197,24,.5);text-transform:uppercase; }
.intro-name { font-family:'Oswald',sans-serif;font-size:clamp(2rem,8vw,5rem);
              letter-spacing:.15em;color:var(--gold);
              text-shadow:0 0 40px rgba(245,197,24,.6),0 0 80px rgba(245,197,24,.2);
              opacity:0;transform:translateY(16px);
              transition:opacity .6s .3s, transform .6s .3s; }
#intro.reveal .intro-name { opacity:1;transform:none; }
.intro-bar-wrap { width:min(220px,50vw);height:2px;background:rgba(255,255,255,.08); }
.intro-bar { height:100%;width:0%;background:var(--gold);
             box-shadow:0 0 8px var(--gold);
             transition:width 1.8s cubic-bezier(.4,0,.2,1); }
#intro.reveal .intro-bar { width:100%; }
.intro-loc { font-family:'Rajdhani',sans-serif;font-size:.6rem;letter-spacing:.3em;
             color:rgba(255,255,255,.35);text-transform:uppercase;
             opacity:0;transition:opacity .5s .8s; }
#intro.reveal .intro-loc { opacity:1; }

/* ── CUSTOM CURSOR ── */
body, *,
*::before, *::after,
a, button, input, [role="button"] { cursor:none !important; }
#cursor {
  position:fixed;z-index:99999;pointer-events:none;
  width:32px;height:32px;
  transform:translate(-50%,-50%);
  transition:transform .08s;
  cursor:none !important;
}
#cursor svg { width:100%;height:100%; }
#cursor.clicking { transform:translate(-50%,-50%) scale(.85); }
@media (hover:none) { #cursor { display:none; } }

/* ── TOOLTIP ── */
#tooltip {
  position:fixed;z-index:6000;pointer-events:none;
  background:rgba(4,5,10,.95);
  border:1px solid rgba(245,197,24,.3);
  border-left:3px solid var(--gold);
  padding:5px 10px;
  font-family:'Rajdhani',sans-serif;font-size:.65rem;
  letter-spacing:.1em;color:#fff;text-transform:uppercase;
  opacity:0;transform:translateY(4px);
  transition:opacity .2s,transform .2s;
  white-space:nowrap;
}
#tooltip.show { opacity:1;transform:translateY(0); }

/* ── MINIMAP ── */
#minimap {
  position:fixed;bottom:16px;right:16px;z-index:300;
  width:90px;height:90px;
  border:1.5px solid rgba(245,197,24,.35);
  border-radius:4px;
  background:rgba(4,6,12,.85);
  overflow:hidden;
  box-shadow:0 0 12px rgba(0,0,0,.8);
}
#minimap canvas { width:100%;height:100%; }
.minimap-label {
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  font-family:'Rajdhani',sans-serif;font-size:.38rem;letter-spacing:.2em;
  color:rgba(245,197,24,.45);text-transform:uppercase;white-space:nowrap;
}
@media (max-width:700px) {
  #minimap { width:70px;height:70px;bottom:10px;right:10px; }
}

/* ── HEALTH / XP BAR ── */
.stat-bars {
  position:fixed;top:54px;left:14px;z-index:200;
  display:flex;flex-direction:column;gap:4px;
}
.stat-row {
  display:flex;align-items:center;gap:6px;
}
.stat-lbl {
  font-family:'Rajdhani',sans-serif;font-size:.4rem;letter-spacing:.25em;
  color:rgba(255,255,255,.35);text-transform:uppercase;width:18px;
}
.stat-track {
  width:90px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;
  overflow:hidden;
}
.stat-fill {
  height:100%;border-radius:2px;transition:width .4s ease;
}
.stat-fill.hp  { background:linear-gradient(90deg,#e03,#ff6b1a);box-shadow:0 0 6px #e03; width:78%; }
.stat-fill.xp  { background:linear-gradient(90deg,#f5c518,#ffe066);box-shadow:0 0 6px #f5c518; width:62%; }
@media (max-width:700px) {
  .stat-bars { top:44px;left:8px; }
  .stat-track { width:70px; }
}

/* ── WANTED STARS ANIMATION ── */
.wanted { position:fixed;top:14px;right:14px;z-index:200;
  display:flex;gap:3px;align-items:center;
  background:rgba(0,0,0,.8);border:1px solid rgba(245,197,24,.18);padding:5px 10px; }
.star { color:var(--gold);font-size:.76rem;opacity:.18;transition:opacity .3s,text-shadow .3s; }
.star.lit { opacity:1;text-shadow:0 0 8px var(--gold); }
.star.pulse { animation:star-pulse .4s ease; }
@keyframes star-pulse {
  0%   { transform:scale(1); }
  40%  { transform:scale(1.5); }
  100% { transform:scale(1); }
}

/* ── KONAMI EASTER EGG ── */
#konami {
  position:fixed;inset:0;z-index:9998;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.92);
  opacity:0;pointer-events:none;
  transition:opacity .4s;
}
#konami.show { opacity:1;pointer-events:all; }
.konami-title {
  font-family:'Oswald',sans-serif;font-size:clamp(1.4rem,5vw,3rem);
  letter-spacing:.2em;color:var(--gold);
  text-shadow:0 0 30px rgba(245,197,24,.7);
  animation:glitch 3s infinite;
}
.konami-sub {
  font-family:'Rajdhani',sans-serif;font-size:.75rem;letter-spacing:.3em;
  color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:12px;
}
.konami-close {
  margin-top:28px;font-family:'Rajdhani',sans-serif;font-size:.65rem;
  letter-spacing:.3em;color:rgba(245,197,24,.6);text-transform:uppercase;cursor:pointer;
  border:1px solid rgba(245,197,24,.3);padding:6px 18px;
}
@keyframes glitch {
  0%,95%,100% { text-shadow:0 0 30px rgba(245,197,24,.7); transform:none; }
  96% { text-shadow:-3px 0 #f00,3px 0 #0ff; transform:skewX(-4deg); }
  97% { text-shadow:3px 0 #f00,-3px 0 #0ff; transform:skewX(2deg); }
  98% { text-shadow:0 0 30px rgba(245,197,24,.7); transform:none; }
}

/* float keyframes — simple translateY, won't interfere with transform */
@keyframes fb0{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 7px)}}
@keyframes fb1{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 9px)}}
@keyframes fb2{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 6px)}}
@keyframes fb3{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 8px)}}
@keyframes fb4{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 7px)}}
@keyframes fb5{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 -10px)}}
@keyframes fb6{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 6px)}}
@keyframes fb7{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 9px)}}
@keyframes fb8{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 7px)}}
@keyframes fb9{0%,100%{margin-top:calc(var(--bh)/-2 + 0px)}  50%{margin-top:calc(var(--bh)/-2 - 8px)}}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- CINEMATIC INTRO -->
<div id="intro">
  <div class="intro-sub">Loading</div>
  <div class="intro-name">Mann Y Devani</div>
  <div class="intro-bar-wrap"><div class="intro-bar" id="introBar"></div></div>
  <div class="intro-loc">India · Portfolio</div>
</div>

<!-- CUSTOM CURSOR -->
<div id="cursor">
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="16" y1="2"  x2="16" y2="12" stroke="#f5c518" stroke-width="1.5"/>
    <line x1="16" y1="20" x2="16" y2="30" stroke="#f5c518" stroke-width="1.5"/>
    <line x1="2"  y1="16" x2="12" y2="16" stroke="#f5c518" stroke-width="1.5"/>
    <line x1="20" y1="16" x2="30" y2="16" stroke="#f5c518" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="3.5" stroke="#f5c518" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="1.2" fill="#f5c518"/>
  </svg>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- KONAMI EASTER EGG -->
<div id="konami">
  <div class="konami-title">CHEAT CODE ACTIVATED</div>
  <div class="konami-sub">5 Star Wanted Level Unlocked 🌟</div>
  <div class="konami-close" id="konamiClose">[ press any key to continue ]</div>
</div>

<div class="hc htl"></div><div class="hc htr"></div>
<div class="hc hbl"></div><div class="hc hbr"></div>

<div class="nameplate">
  <div class="np-lbl">Player</div>
  <div class="np-name">Mann Y Devani</div>
</div>

<!-- HEALTH / XP BARS -->
<div class="stat-bars">
  <div class="stat-row">
    <span class="stat-lbl">HP</span>
    <div class="stat-track"><div class="stat-fill hp" id="hpBar"></div></div>
  </div>
  <div class="stat-row">
    <span class="stat-lbl">XP</span>
    <div class="stat-track"><div class="stat-fill xp" id="xpBar"></div></div>
  </div>
</div>

<div class="wanted" id="wantedBar">
  <span class="star" id="s1">★</span><span class="star" id="s2">★</span><span class="star" id="s3">★</span><span class="star" id="s4">★</span><span class="star" id="s5">★</span>
</div>

<!-- MINIMAP -->
<div id="minimap">
  <canvas id="mmCanvas"></canvas>
  <div class="minimap-label">India</div>
</div>

<div class="hint-wrap" id="hintWrap">
  <div class="hint-key">▲</div>
  <span class="hint-txt hint-desktop">hover to reveal</span>
  <span class="hint-txt hint-mobile">tap to reveal</span>
</div>

<div class="mob-grid" id="mobGrid">
  <div class="mob-close" id="mobClose">✕</div>
  <div class="mob-inner" id="mobInner"></div>
</div>

<div class="stage">
  <div class="char-unit" id="charUnit">
    <!-- transparent hover zone covering char + arc above -->
    <div class="hover-zone" id="hoverZone"></div>

    <!-- character SVG -->
    <div class="char-svg-wrap">
      <svg id="char-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648.97 991.17" preserveAspectRatio="xMidYMax meet" style="width:100%;height:100%;display:block;pointer-events:none;user-select:none;">
  <defs>
    <style>
      .cls-1 {
        fill: #3e0203;
      }

      .cls-2 {
        fill: #605f5f;
      }

      .cls-3 {
        fill: #fdfcfa;
      }

      .cls-4 {
        fill: #805231;
      }

      .cls-5 {
        fill: #22304c;
      }

      .cls-6 {
        fill: #400305;
      }

      .cls-7 {
        fill: #080102;
      }

      .cls-8 {
        fill: #62728c;
      }

      .cls-9 {
        fill: #f4daaa;
      }

      .cls-10 {

<script>
const LINKS = [
  { label:'GitHub',     sub:'code',       url:'https://github.com/Mann763',                                                                       icon:'🐙', color:'#58a6ff', bg:'rgba(8,14,22,.93)'   },
  { label:'LinkedIn',   sub:'connect',    url:'https://linkedin.com/in/manndevani',                                                                icon:'💼', color:'#1ad4ff', bg:'rgba(5,20,45,.93)'   },
  { label:'YouTube',    sub:'videos',     url:'https://www.youtube.com/@MannDevani',                                                               icon:'▶',  color:'#ff4444', bg:'rgba(30,4,4,.93)'    },
  { label:'Book',       sub:'published',  url:'https://www.google.co.in/books/edition/Life_To_Death/rwYxEAAAQBAJ?hl=en&gbpv=0',                   icon:'📖', color:'#4ade80', bg:'rgba(4,22,10,.93)'   },
  { label:'Itch.io',    sub:'games',      url:'https://manndevani.itch.io/',                                                                       icon:'🎮', color:'#ff6b1a', bg:'rgba(35,10,4,.93)'   },
  { label:'DeviantArt', sub:'gallery',    url:'https://www.deviantart.com/manndevani/gallery',                                                     icon:'🎨', color:'#b44fff', bg:'rgba(18,6,38,.93)'   },
  { label:'Fab',        sub:'assets',     url:'https://www.fab.com/sellers/MannDev',                                                               icon:'✦',  color:'#00d4aa', bg:'rgba(4,22,18,.93)'   },
  { label:'Linktree',   sub:'links',      url:'https://linktr.ee/manndevani',                                                                      icon:'🌿', color:'#43e55e', bg:'rgba(4,20,8,.93)'    },
  { label:'Resume',     sub:'download',   url:'https://drive.google.com/drive/folders/1FL0XYArybb3YSsBg_I1DJV95OUgYLW6-?usp=drive_link',          icon:'📄', color:'#ffa94d', bg:'rgba(28,16,4,.93)'   },
];

function build() {
  const unit    = document.getElementById('charUnit');
  const root    = document.getElementById('bubblesRoot');
  const connSvg = document.getElementById('connSvg');
  root.innerHTML = '';
  connSvg.innerHTML = '';

  const unitH = unit.offsetHeight;
  const unitW = unit.offsetWidth;
  const vw    = window.innerWidth;
  const mob   = vw <= 700;
  const bW    = mob ? 44 : 76;
  const bH    = mob ? 44 : 76;

  // Head position in viewport coords
  const rect    = unit.getBoundingClientRect();
  const headVX  = rect.left + unitW * 0.5;
  const headVY  = rect.top  + unitH * 0.30;

  // On mobile use a fixed vw-based radius so bubbles always fit
  const pad = bW * 0.5 + 8;
  const maxR = Math.floor(Math.min(
    headVX - pad,
    vw - headVX - pad,
    headVY - pad,
    window.innerHeight - headVY - pad
  ) * (mob ? 0.92 : 0.88));

  const R = Math.max(maxR, mob ? 60 : 80);

  // Arc centre is at .bubbles-root which is top:16% of unit
  // 220° to 320° tight arc above head
  const count    = LINKS.length;
  const startDeg = 205;
  const endDeg   = 335;
  const step     = (endDeg - startDeg) / (count - 1);

  LINKS.forEach((lnk, i) => {
    const deg = startDeg + step * i;
    const rad = deg * Math.PI / 180;
    const tx  = Math.cos(rad) * R;
    const ty  = Math.sin(rad) * R;

    // connector line (from 0,0 = head anchor to bubble centre)
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1','0'); line.setAttribute('y1','0');
    line.setAttribute('x2', String(tx)); line.setAttribute('y2', String(ty));
    line.setAttribute('stroke', lnk.color);
    line.setAttribute('stroke-width','1');
    line.setAttribute('stroke-dasharray','3 5');
    line.setAttribute('opacity','.3');
    connSvg.appendChild(line);

    // blip at head
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx','0'); dot.setAttribute('cy','0');
    dot.setAttribute('r','3'); dot.setAttribute('fill','rgba(245,197,24,.6)');
    if (i === 0) connSvg.appendChild(dot);

    const delay = i * 70;
    const dur   = 2.6 + i * 0.28;

    const a = document.createElement('a');
    a.className = 'bubble';
    a.href = lnk.url;
    a.style.cssText = `
      --tx:${tx}px; --ty:${ty}px;
      --bw:${bW}px; --bh:${bH}px;
      border-color:${lnk.color};
      background:${lnk.bg};
      color:${lnk.color};
      box-shadow:0 0 18px ${lnk.color}44, inset 0 1px 0 rgba(255,255,255,.06);
      transition-delay:${delay}ms,${delay}ms;
      animation:fb${i} ${dur}s ease-in-out ${delay}ms infinite;
      animation-play-state:paused;
    `;
    a.innerHTML = `
      <span class="b-icon">${lnk.icon}</span>
      <span class="b-label">${lnk.label}</span>
      <span class="b-sub">${lnk.sub}</span>
    `;
    root.appendChild(a);
  });
}

window.addEventListener('load',  () => { build(); setTimeout(build,300); });
window.addEventListener('resize', build);

// ── hover state via JS on the whole char-unit (not CSS :hover)
//    so bubbles stay visible even when mouse is over them
const unit     = document.getElementById('charUnit');
const hintWrap = document.getElementById('hintWrap');
let hoverTimer;

const isMobile = () => window.innerWidth <= 700 || ('ontouchstart' in window);

function setHovered(on) {
  clearTimeout(hoverTimer);
  if (on) {
    unit.classList.add('hovered');
    hintWrap.style.opacity = '0';
    unit.querySelectorAll('.bubble').forEach(b => b.style.animationPlayState='running');
  } else {
    hoverTimer = setTimeout(() => {
      unit.classList.remove('hovered');
      hintWrap.style.opacity = '1';
      unit.querySelectorAll('.bubble').forEach(b => b.style.animationPlayState='paused');
    }, 120);
  }
}

unit.addEventListener('mouseenter', () => { if (!isMobile()) setHovered(true); });
unit.addEventListener('mouseleave', () => { if (!isMobile()) setHovered(false); });

// ── Mobile grid
const mobGrid  = document.getElementById('mobGrid');
const mobClose = document.getElementById('mobClose');
const mobInner = document.getElementById('mobInner');

LINKS.forEach(lnk => {
  const a = document.createElement('a');
  a.className = 'mob-btn';
  a.href = lnk.url;
  a.style.cssText = `border-color:${lnk.color};color:${lnk.color};box-shadow:0 0 10px ${lnk.color}33;`;
  a.innerHTML = `<span class="mob-btn-icon">${lnk.icon}</span><span class="mob-btn-label">${lnk.label}</span>`;
  mobInner.appendChild(a);
});

function openMobGrid()  { mobGrid.classList.add('open'); }
function closeMobGrid() { mobGrid.classList.remove('open'); }

mobClose.addEventListener('click', e => { e.stopPropagation(); closeMobGrid(); });
mobGrid.addEventListener('click', e => { if (e.target === mobGrid) closeMobGrid(); });

// tap on character — works on both touch and click
unit.addEventListener('touchend', e => {
  if (!isMobile()) return;
  e.preventDefault();
  openMobGrid();
});
unit.addEventListener('click', e => {
  if (!isMobile()) return;
  openMobGrid();
});

// also catch taps on the hover-zone overlay
document.getElementById('hoverZone').addEventListener('touchend', e => {
  if (!isMobile()) return;
  e.preventDefault();
  openMobGrid();
});
(function(){
  const cvs = document.getElementById('bgCanvas');
  const ctx = cvs.getContext('2d');
  let W, H, mouse = {x:.5, y:.5};

  // ── Buildings data (normalized 0-1 coords, tiled across width)
  const BLDS = [
    {x:0,    w:40,  h:.58},{x:44,   w:30,  h:.42},{x:78,   w:52,  h:.74},
    {x:134,  w:24,  h:.35},{x:162,  w:64,  h:.54},{x:230,  w:36,  h:.67},
    {x:270,  w:46,  h:.39},{x:320,  w:32,  h:.81},{x:356,  w:56,  h:.49},
    {x:416,  w:26,  h:.61},{x:446,  w:72,  h:.45},{x:522,  w:42,  h:.71},
    {x:568,  w:56,  h:.57},{x:628,  w:36,  h:.69},{x:668,  w:62,  h:.43},
    {x:734,  w:44,  h:.65},{x:782,  w:54,  h:.53},{x:840,  w:66,  h:.45},
    {x:910,  w:50,  h:.54},{x:964,  w:60,  h:.67},{x:1028, w:72,  h:.57},
    {x:1104, w:54,  h:.44},{x:1162, w:40,  h:.62},{x:1206, w:68,  h:.50},
    {x:1278, w:36,  h:.38},{x:1318, w:58,  h:.55}
  ];

  // Stars
  const STARS = Array.from({length:90}, () => ({
    x: Math.random(), y: Math.random() * .55,
    r: Math.random() < .1 ? 1.2 : .6,
    alpha: .18 + Math.random() * .45,
    warm: Math.random() < .15
  }));

  // Window lights: {bx (bld index), fx (frac x in bld), fy (frac y), col, phase}
  let WIN = [];
  function genWindows() {
    WIN = [];
    BLDS.forEach((b, bi) => {
      const cols = Math.floor(b.w / 9);
      const rows = Math.floor(b.h * 44 / 9); // rough
      for (let c=0;c<cols;c++) for (let r=0;r<rows;r++) {
        if (Math.random() < .38) {
          const palettes = ['rgba(255,200,80,', 'rgba(100,180,255,', 'rgba(255,150,50,'];
          WIN.push({bi, c, r, cols, rows, pal: palettes[Math.floor(Math.random()*palettes.length)],
            phase: Math.random()*Math.PI*2, speed: .3+Math.random()*.5});
        }
      }
    });
  }

  // Rain drops
  const DROPS = Array.from({length:60}, () => ({
    x: Math.random(), y: Math.random(),
    speed: .004 + Math.random()*.006,
    len: .02 + Math.random()*.03,
    alpha: .04 + Math.random()*.08
  }));

  // Neon scan line (horizontal sweep)
  let scanY = 0;

  function resize() {
    W = cvs.width  = window.innerWidth;
    H = cvs.height = window.innerHeight;
    genWindows();
  }

  function draw(ts) {
    ctx.clearRect(0, 0, W, H);

    // Sky gradient
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,   '#04050a');
    sky.addColorStop(.35, '#080c14');
    sky.addColorStop(.58, '#0e1420');
    sky.addColorStop(.82, '#160f06');
    sky.addColorStop(1,   '#0a0804');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Subtle mouse-reactive aurora glow
    const ax = mouse.x * W, ay = mouse.y * H * .6;
    const aurora = ctx.createRadialGradient(ax, ay, 0, ax, ay, W*.5);
    aurora.addColorStop(0,   'rgba(255,100,20,.03)');
    aurora.addColorStop(.5,  'rgba(50,10,80,.02)');
    aurora.addColorStop(1,   'transparent');
    ctx.fillStyle = aurora;
    ctx.fillRect(0, 0, W, H);

    // Stars — parallax shift with mouse
    const sx = (mouse.x - .5) * 12, sy = (mouse.y - .5) * 6;
    STARS.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x*W + sx, s.y*H + sy, s.r, 0, Math.PI*2);
      ctx.fillStyle = s.warm
        ? `rgba(255,220,100,${s.alpha})`
        : `rgba(255,255,255,${s.alpha})`;
      ctx.fill();
    });

    // Repeating skyline — tile BLDS across full width
    const bldH = H * .44;
    const BASE_W = 1376; // approximate span of BLDS
    const tiles = Math.ceil(W / BASE_W) + 1;
    const bx_off = (mouse.x - .5) * 16; // subtle parallax

    ctx.save();
    for (let t=0; t<tiles; t++) {
      const ox = t * BASE_W + bx_off;
      BLDS.forEach(b => {
        const bx = ox + b.x, btop = H - bldH * b.h;
        ctx.fillStyle = '#0d0f17';
        ctx.fillRect(bx, btop, b.w, H - btop);
        // top edge slightly lighter
        ctx.fillStyle = 'rgba(255,255,255,.03)';
        ctx.fillRect(bx, btop, b.w, 1);
      });
    }
    ctx.restore();

    // Window lights
    WIN.forEach(w => {
      const b = BLDS[w.bi];
      const bldH_ = H * .44;
      for (let t=0; t<tiles; t++) {
        const ox = t * BASE_W + bx_off;
        const bx = ox + b.x;
        const btop = H - bldH_ * b.h;
        const cellW = b.w / w.cols;
        const cellH = (H - btop) / w.rows;
        const wx = bx + w.c * cellW + 2;
        const wy = btop + w.r * cellH + 2;
        const flicker = .3 + .2 * Math.sin(ts*.001 * w.speed + w.phase);
        ctx.fillStyle = w.pal + flicker + ')';
        ctx.fillRect(wx, wy, Math.max(2, cellW-4), Math.max(2, cellH-4));
      }
    });

    // Ground glow
    const grd = ctx.createLinearGradient(0, H*.72, 0, H);
    grd.addColorStop(0,   'transparent');
    grd.addColorStop(.4,  'rgba(255,70,8,.04)');
    grd.addColorStop(.7,  'rgba(255,95,18,.11)');
    grd.addColorStop(1,   'rgba(255,115,28,.17)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, H*.72, W, H*.28);

    // ── ROAD ──
    const roadTop    = H * .905;
    const roadH      = H * .095;
    const kerbH      = 3;
    const pavementH  = H * .018;
    const laneY      = roadTop + roadH * .5; // centre line

    // Pavement / sidewalk above road
    ctx.fillStyle = '#0e0d0b';
    ctx.fillRect(0, roadTop - pavementH, W, pavementH);
    // pavement edge detail
    ctx.fillStyle = 'rgba(255,140,30,.08)';
    ctx.fillRect(0, roadTop - pavementH, W, 1);

    // Kerb top
    ctx.fillStyle = '#1a1714';
    ctx.fillRect(0, roadTop - kerbH, W, kerbH);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(0, roadTop - kerbH, W, 1);

    // Road asphalt — two lanes
    const roadGrad = ctx.createLinearGradient(0, roadTop, 0, roadTop + roadH);
    roadGrad.addColorStop(0,   '#141210');
    roadGrad.addColorStop(.5,  '#111009');
    roadGrad.addColorStop(1,   '#0d0b08');
    ctx.fillStyle = roadGrad;
    ctx.fillRect(0, roadTop, W, roadH);

    // Wet road reflections — shimmer from building lights
    const refGrad = ctx.createLinearGradient(0, roadTop, 0, roadTop + roadH);
    refGrad.addColorStop(0,   'rgba(255,110,20,.07)');
    refGrad.addColorStop(.4,  'rgba(255,140,40,.04)');
    refGrad.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = refGrad;
    ctx.fillRect(0, roadTop, W, roadH);

    // Reflection streaks (vertical shimmer pools)
    [.15,.28,.44,.6,.73,.87].forEach(fx => {
      const rx = fx * W + (mouse.x - .5) * 8;
      const rg = ctx.createRadialGradient(rx, roadTop + roadH*.3, 0, rx, roadTop + roadH*.3, 30);
      rg.addColorStop(0,   'rgba(255,180,60,.06)');
      rg.addColorStop(1,   'transparent');
      ctx.fillStyle = rg;
      ctx.fillRect(rx - 30, roadTop, 60, roadH * .6);
    });

    // Centre dashed line
    ctx.save();
    ctx.setLineDash([18, 14]);
    ctx.strokeStyle = 'rgba(255,220,0,.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, laneY);
    ctx.lineTo(W, laneY);
    ctx.stroke();
    ctx.restore();

    // Edge lane lines (solid white)
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, roadTop + 2);       ctx.lineTo(W, roadTop + 2);       ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, roadTop + roadH - 2); ctx.lineTo(W, roadTop + roadH - 2); ctx.stroke();

    // Road bottom shadow
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(0, roadTop + roadH - 4, W, 4);

    // Rain — faint diagonal streaks
    ctx.save();
    ctx.strokeStyle = 'rgba(150,200,255,1)';
    ctx.lineWidth = .5;
    DROPS.forEach(d => {
      d.y += d.speed;
      if (d.y > 1) { d.y = -d.len; d.x = Math.random(); }
      const rx = d.x * W, ry = d.y * H;
      ctx.globalAlpha = d.alpha;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - d.len*H*.15, ry + d.len*H);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    // Scanline sweep — very subtle gold line
    scanY = (scanY + .4) % H;
    const sl = ctx.createLinearGradient(0, scanY-4, 0, scanY+4);
    sl.addColorStop(0,   'transparent');
    sl.addColorStop(.5,  'rgba(245,197,24,.04)');
    sl.addColorStop(1,   'transparent');
    ctx.fillStyle = sl;
    ctx.fillRect(0, scanY-4, W, 8);

    // Scanlines texture
    ctx.fillStyle = 'rgba(0,0,0,.025)';
    for (let y=0; y<H; y+=4) ctx.fillRect(0, y, W, 1);

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('mousemove', e => {
    mouse.x = e.clientX / innerWidth;
    mouse.y = e.clientY / innerHeight;
  });
  window.addEventListener('deviceorientation', e => {
    mouse.x = .5 + Math.max(-1, Math.min(1, (e.gamma||0)/45)) * .5;
    mouse.y = .5 + Math.max(-1, Math.min(1, ((e.beta||45)-45)/45)) * .5;
  });

  resize();
  requestAnimationFrame(draw);
})();

(function(){
  const mm  = document.getElementById('minimap');
  const cvs = document.getElementById('mmCanvas');
  const ctx = cvs.getContext('2d');
  let blipT = 0;

  function resizeMM() {
    cvs.width  = mm.offsetWidth;
    cvs.height = mm.offsetHeight;
  }
  resizeMM();
  window.addEventListener('resize', resizeMM);

  // Static street grid
  function drawMM(ts) {
    const W = cvs.width, H = cvs.height;
    ctx.clearRect(0,0,W,H);

    // BG
    ctx.fillStyle = '#060810';
    ctx.fillRect(0,0,W,H);

    // Street grid
    ctx.strokeStyle = 'rgba(245,197,24,.12)';
    ctx.lineWidth = 1;
    const streets = [
      [0,H*.3,W,H*.3],[0,H*.55,W,H*.55],[0,H*.75,W,H*.75],
      [W*.2,0,W*.2,H],[W*.45,0,W*.45,H],[W*.7,0,W*.7,H],[W*.88,0,W*.88,H],
    ];
    streets.forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });

    // Park block
    ctx.fillStyle = 'rgba(30,60,20,.5)';
    ctx.fillRect(W*.45,H*.3,W*.25,H*.25);

    // Water
    ctx.fillStyle = 'rgba(10,30,80,.6)';
    ctx.fillRect(0,H*.75,W*.2,H*.25);

    // Player blip — pulsing gold dot
    blipT += .04;
    const bx = W*.45, by = H*.45;
    const pulse = .5 + .5 * Math.sin(blipT * 3);
    ctx.beginPath();
    ctx.arc(bx, by, 3 + pulse*2, 0, Math.PI*2);
    ctx.fillStyle = `rgba(245,197,24,${.15 * pulse})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bx, by, 3, 0, Math.PI*2);
    ctx.fillStyle = '#f5c518';
    ctx.fill();

    // North indicator
    ctx.fillStyle = 'rgba(245,197,24,.6)';
    ctx.font = 'bold 7px Rajdhani,sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('N', W-3, 9);

    requestAnimationFrame(drawMM);
  }
  requestAnimationFrame(drawMM);
})();

// ── CANVAS: heavier rain + car headlights ──
// (injected into the existing canvas draw loop via monkey-patching not needed —
//  car headlights are added to the DROPS system below by extending the canvas IIFE above)

// ── CAR HEADLIGHTS on ground ──
(function(){
  const cvs = document.getElementById('bgCanvas');
  const ctx = cvs.getContext('2d');

  const CARS = Array.from({length:6}, (_, i) => ({
    x:    Math.random(),
    // alternate lanes: top lane (going right) and bottom lane (going left)
    lane: i % 2,
    spd:  (.0005 + Math.random()*.0009) * (i % 2 === 0 ? 1 : -1),
    col:  Math.random()<.7 ? '#fff8e0' : '#ffe0b0',
    tail: Math.random()<.5 ? '#ff2200' : '#cc1100',
  }));

  function drawCar(c) {
    const W = cvs.width, H = cvs.height;
    const roadTop = H * .905;
    const roadH   = H * .095;
    const laneY   = roadTop + roadH * .5;
    // lane 0 = top half (going right), lane 1 = bottom half (going left)
    const cy = c.lane === 0 ? laneY - roadH * .18 : laneY + roadH * .18;
    const cx = c.x * W;
    const dir = c.spd > 0 ? 1 : -1;

    // Car dimensions
    const cw = 28, ch = 9, roof = 5;

    ctx.save();
    ctx.translate(cx, cy);
    if (dir < 0) ctx.scale(-1, 1);

    // Body
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.roundRect(-cw/2, -ch/2, cw, ch, 2);
    ctx.fill();

    // Roof
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.roundRect(-cw/2 + 6, -ch/2 - roof, cw - 12, roof + 1, 2);
    ctx.fill();

    // Windshield glint
    ctx.fillStyle = 'rgba(100,160,255,.12)';
    ctx.beginPath();
    ctx.roundRect(-cw/2 + 7, -ch/2 - roof + 1, cw - 16, roof - 2, 1);
    ctx.fill();

    // Wheels
    ctx.fillStyle = '#0a0a0a';
    [[-cw/2+5, ch/2], [cw/2-5, ch/2]].forEach(([wx, wy]) => {
      ctx.beginPath();
      ctx.ellipse(wx, wy, 3.5, 2.5, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.06)';
      ctx.lineWidth = .5;
      ctx.stroke();
    });

    // Headlights (front = right side)
    [-2.5, 2.5].forEach(oy => {
      // glow beam
      const beam = ctx.createRadialGradient(cw/2, oy, 0, cw/2+18, oy, 22);
      beam.addColorStop(0, 'rgba(255,248,200,.18)');
      beam.addColorStop(1, 'transparent');
      ctx.fillStyle = beam;
      ctx.fillRect(cw/2, oy-12, 30, 24);

      // light dot
      ctx.beginPath();
      ctx.arc(cw/2 - 1, oy, 1.5, 0, Math.PI*2);
      ctx.fillStyle = c.col;
      ctx.globalAlpha = .95;
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // Tail lights (rear = left side)
    [-2.5, 2.5].forEach(oy => {
      ctx.beginPath();
      ctx.arc(-cw/2 + 1, oy, 1.2, 0, Math.PI*2);
      ctx.fillStyle = c.tail;
      ctx.globalAlpha = .8;
      ctx.fill();
      // tail glow
      ctx.shadowColor = c.tail;
      ctx.shadowBlur = 4;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    });

    ctx.restore();
  }

  function animateCars() {
    const W = cvs.width;
    CARS.forEach(c => {
      c.x += c.spd;
      if (c.x > 1.08)  c.x = -0.08;
      if (c.x < -0.08) c.x = 1.08;
      drawCar(c);
    });
    requestAnimationFrame(animateCars);
  }
  requestAnimationFrame(animateCars);
})();

// ── SOUND EFFECTS (Web Audio API — no files needed) ──
(function(){
  let ctx;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Browsers only allow audio to start after a real user gesture (click/keydown/touch),
  // not hover — unlock the context on the first such gesture so the very first hover sound works.
  ['pointerdown','keydown','touchstart'].forEach(evt => {
    document.addEventListener(evt, () => getCtx(), { once: true, passive: true });
  });

  function blip(freq=880, dur=0.06, vol=0.08, type='sine') {
    try {
      const ac  = getCtx();
      const osc = ac.createOscillator();
      const gain= ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      osc.start(); osc.stop(ac.currentTime + dur);
    } catch(e){}
  }

  function whoosh() {
    try {
      const ac   = getCtx();
      const buf  = ac.createBuffer(1, ac.sampleRate*.15, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
      const src  = ac.createBufferSource();
      const gain = ac.createGain();
      const filt = ac.createBiquadFilter();
      src.buffer = buf; filt.type='bandpass'; filt.frequency.value=1200;
      src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
      gain.gain.setValueAtTime(.06, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .15);
      src.start();
    } catch(e){}
  }

  // hover on bubble → blip
  document.addEventListener('mouseover', e => {
    if (e.target.closest('.bubble')) blip(660, .05, .06);
  });

  // click bubble → whoosh
  document.addEventListener('click', e => {
    if (e.target.closest('.bubble') || e.target.closest('.mob-btn')) whoosh();
  });

  // hover enter char → low hum blip
  document.getElementById('charUnit').addEventListener('mouseenter', () => blip(220, .12, .05, 'triangle'));
  document.getElementById('charUnit').addEventListener('touchend', () => blip(220, .12, .05, 'triangle'));
})();

// ── KONAMI CODE EASTER EGG ──
(function(){
  const SEQ = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let idx = 0;
  const panel = document.getElementById('konami');
  const close = document.getElementById('konamiClose');

  document.addEventListener('keydown', e => {
    if (e.key === SEQ[idx]) {
      idx++;
      if (idx === SEQ.length) {
        idx = 0;
        panel.classList.add('show');
        // 5-star wanted
        [1,2,3,4,5].forEach((n,i) => {
          const s = document.getElementById('s'+n);
          setTimeout(()=>{ s.classList.add('lit','pulse'); }, i*120);
        });
      }
    } else { idx = 0; }
  });

  function closeKonami() { panel.classList.remove('show'); }
  close.addEventListener('click', closeKonami);
  document.addEventListener('keydown', e => { if (panel.classList.contains('show') && e.key === 'Escape') closeKonami(); });
})();
</script>
